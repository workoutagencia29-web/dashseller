<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Tinge a barra do navegador (Safari/Chrome) com o azul-escuro do app, pra
         não destoar da UI. No mobile o app é dark por padrão. -->
    <meta name="theme-color" content="#0C1730" />

    <!-- PWA / "Adicionar à Tela de Início": abre em tela cheia (sem a barra do
         navegador embaixo), resolvendo o conflito da bottom nav com o Safari. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nummo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Nummo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme before paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('hr-theme')
          var theme = stored || 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
